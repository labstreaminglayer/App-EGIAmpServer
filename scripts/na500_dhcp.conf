# Example DHCP for an isolated NA500 Ethernet link.
# Change en10 to your adapter, and configure it as 10.10.10.61/24 first.
# Run from the repository root; Ctrl+C stops the server:
# sudo /opt/homebrew/sbin/dnsmasq --no-daemon --conf-file="$PWD/scripts/na500_dhcp.conf"
interface=en10
bind-interfaces
port=0
dhcp-range=10.10.10.62,10.10.10.62,255.255.255.0,12h
# This isolated link provides neither a default gateway nor a DNS server.
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/private/tmp/egi-na500-dhcp.leases
log-dhcp
